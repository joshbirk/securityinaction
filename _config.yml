title: Salesforce Security Workshop
description: Hands-on workshop for hardening your Salesforce org against the most common data-access breaches.
baseurl: ""
url: ""

# Theme — using remote_theme for zero-config GitHub Pages deploy.
# For local dev with `bundle exec jekyll serve`, the Gemfile also pulls it in.
remote_theme: just-the-docs/just-the-docs

# Custom color palette
color_scheme: salesforce

# Built-in search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# Layout / nav
nav_external_links:
  - title: Health Check docs
    url: https://help.salesforce.com/s/articleView?id=sf.security_health_check.htm
    hide_icon: false
  - title: Shield Platform Encryption
    url: https://help.salesforce.com/s/articleView?id=sf.security_pe_overview.htm
    hide_icon: false

# Footer
footer_content: 'Workshop content &copy; the authors. Site generated from <code>index.md</code> using <a href="https://just-the-docs.com">Just the Docs</a>.'

# Last-edit metadata
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

# Heading anchor links
heading_anchors: true

# Aux links (top-right corner)
aux_links:
  "View on GitHub":
    - "//github.com/YOUR-USERNAME/YOUR-REPO"
aux_links_new_tab: true

# Back-to-top button
back_to_top: true
back_to_top_text: "Back to top"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Build settings
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Don't process these
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
